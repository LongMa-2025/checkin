name: guard

# 定时协议检查已暂停。保留 workflow_dispatch，必要时仍可手动触发。

on:
  workflow_dispatch:

concurrency:
  group: glados-guard
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 协议一致性检查
        run: node guard.js
        env:
          DOMAIN: ${{ secrets.DOMAIN }}

      - name: 失败时提示
        if: failure()
        run: |
          echo "::error::协议已变化，签到逻辑需要更新。请查看上方日志中的 [CRITICAL] 项。"
